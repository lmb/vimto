name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Get ci-kernels test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
    - id: matrix
      uses: cilium/ci-kernels/matrix@v7.3

    - id: filter
      name: Select newest and oldest kernel
      env:
        MATRIX: ${{ steps.matrix.outputs.matrix }}
      run: echo "matrix=$(jq -c '[first, last]' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

  amd64:
    name: amd64 (${{ matrix.version }})
    runs-on: ubuntu-26.04
    needs: matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      CI_KERNEL: ghcr.io/cilium/ci-kernels:${{ matrix.version }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gdb qemu-system-x86

    - run: sudo chmod 0666 /dev/kvm

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  arm64:
    name: arm64 (${{ matrix.version }})
    runs-on: ubuntu-26.04-arm
    needs: matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      CI_KERNEL: ghcr.io/cilium/ci-kernels:${{ matrix.version }}
      VIMTO_DISABLE_KVM: "true"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gdb qemu-system-aarch64

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - run: go generate ./...

    - name: Check for drift
      run: git diff --exit-code --stat

  results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Results
    needs:
    - matrix
    - amd64
    - arm64
    - generate
    steps:
    - run: exit 1
      if: >-
        ${{
              contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        }}
